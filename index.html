<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flores-portfolio</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Welcome To My Restaurant</h1>
    <header>
        <nav>
            <lu>
                <li><a href="#Services">Services</a></li>
                <li><a href="#Contact">Contact Me</a></li>
            </lu>
        </nav>
    </header>
    <main>

        <section id="Services">
            <h2 class="Services">Menu</h2>
            <p>Pizza, Chees Burger, Fries, Carbonara and other Coffe Drink</p>
        </section>
        <section id="Contact">
            <h2 class="Contact">Contact</h2>
            <form action="#">

                <label for="name"></br>Name</label></br>
                <input type="text" id="name" name="name" required>
                <label for="email"></br>Email</label></br>
                <input type="email" name="email" id="email" required>
                
                <label for="message"></br>Message</label></br>
                <textarea name="message" id="message" rows="2" required></textarea>
                <button type="submit"></br>Send Message</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
<footer>
    <h1>"Alright have a great day"</h1>
</footer>

</html>
